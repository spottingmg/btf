<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Betriebshofliste</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--tx:#1a1a1a;--mut:#6b6b73;--line:#e2e2e8;--acc:#b40055;--ok:#1b7f3b;--warn:#a86a00;--bad:#c0262d}
@media (prefers-color-scheme:dark){:root{--bg:#141417;--card:#1d1d22;--tx:#ececf0;--mut:#9a9aa6;--line:#2c2c34;--acc:#ff5fa2;--ok:#4cc27a;--warn:#e0a23c;--bad:#ff6b73}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;padding:.8rem 1rem;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
h1{font-size:1.1rem;margin:0;color:var(--acc)}
.conn{font-size:.8rem;color:var(--mut)}
.conn b{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;background:var(--bad);margin-right:.35rem}
.conn.on b{background:var(--ok)}
.sp{flex:1}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.35rem .7rem;cursor:pointer}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.35rem .6rem}
main{padding:.75rem 1rem;max-width:1700px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.8rem;align-items:center}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:.5rem .6rem;border-bottom:1px solid var(--line);white-space:nowrap}
td.wrap{white-space:normal;max-width:20rem;min-width:11rem}
td.stop{min-width:20rem}
.sid{font-size:.75rem;margin-left:.35rem;font-variant-numeric:tabular-nums}
.side{font-size:.78rem;opacity:.8}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);position:sticky;top:0;background:var(--card);cursor:pointer}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:color-mix(in srgb,var(--acc) 6%,transparent)}
.n{font-weight:700;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:.05rem .5rem;border-radius:99px;font-size:.78rem;font-weight:600;border:1px solid currentColor}
.fahrt{color:var(--ok)}.hof{color:var(--acc)}.off{color:var(--warn)}
.mut{color:var(--mut)}
.msg{padding:1rem;border:1px dashed var(--line);border-radius:10px;margin-bottom:.8rem;background:var(--card)}
.msg.err{border-color:var(--bad)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--tx);max-width:min(980px,96vw);width:100%;max-height:94vh;overflow:auto;padding:1rem}
textarea#sAnch{min-height:22rem;height:50vh;resize:vertical;font:13px/1.45 ui-monospace,Consolas,monospace}
dialog::backdrop{background:#0008}
label{display:block;margin:.6rem 0 .2rem;font-size:.8rem;color:var(--mut)}
dialog input,dialog select,dialog textarea{width:100%}
pre{white-space:pre-wrap;word-break:break-all;font-size:.78rem;background:var(--bg);padding:.6rem;border-radius:8px;max-height:45vh;overflow:auto}
.row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem;justify-content:flex-end}
@media (max-width:640px){th:nth-child(8),th:nth-child(9),td:nth-child(8),td:nth-child(9){display:none}}
</style>
</head>
<body>
<header>
  <h1>Betriebshofliste</h1>
  <span class="conn" id="conn"><b></b><span id="connTxt">nicht verbunden</span></span>
  <span class="conn" id="stand"></span>
  <span class="sp"></span>
  <span class="conn" id="fhStat"></span>
  <button id="bJson" title="Stränge (Punkte + Einstellungen) als JSON speichern. Umschalt+Klick: andere Datei wählen">Stränge speichern</button>
  <button id="bLoad" title="Stränge aus einer JSON-Datei laden">Stränge laden</button>
  <input type="file" id="fLoad" accept=".json,application/json" hidden>
  <button id="bNow" title="Daten jetzt übernehmen">Jetzt aktualisieren</button>
  <button id="bSet">Einstellungen</button>
</header>
<main>
  <div id="notice"></div>
  <div class="bar">
    <button data-f="alle" class="on">Alle</button>
    <button data-f="fahrt">Unterwegs</button>
    <button data-f="hof">Im Betriebshof</button>
    <button data-f="off">Kein Signal</button>
    <input id="q" type="search" placeholder="Wagen, Linie, Kurs, Dienst, Strang …">
    <span class="mut" id="cnt"></span>
  </div>
  <div class="box">
    <table>
      <thead><tr>
        <th data-s="wagen">Wagen</th><th data-s="line">Linie</th><th data-s="kurs">Kurs</th><th data-s="dienst">Dienst</th>
        <th data-s="status">Status</th><th data-s="ort">Standort</th><th data-s="stop">Letzter Halt → nächster</th><th data-s="dest">Ziel</th><th data-s="t">Zuletzt</th><th>Karte</th>
      </tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
  <p class="mut" style="font-size:.8rem">Quelle: Firebase-Datenbank der Livekarte (nur Lesen). Wagen, die auf der Karte verschwinden, bleiben hier mit ihrer letzten Position erhalten.</p>
</main>

<dialog id="dSet">
  <h3 style="margin-top:0">Einstellungen</h3>
  <label>Feld für Letzter Halt (optional – sonst wird er aus dem Wechsel des nächsten Halts abgeleitet)</label><select id="sStop"></select>
  <label>Karte öffnen mit</label><select id="sMap"><option value="google">Google Maps</option><option value="osm">OpenStreetMap</option><option value="custom">Eigene URL (z. B. Livekarte)</option></select>
  <label>Eigene Karten-URL – {lat} und {lon} werden ersetzt</label><input id="sMapTpl" placeholder="https://…?lat={lat}&amp;lon={lon}">
  <label>Aktualisierung der Liste (Sekunden)</label><input id="sEvery" type="number" min="5" max="3600">
  <label>Datenbank-URL</label><input id="sUrl">
  <label>Pfad der Fahrzeuge in der Datenbank</label>
  <div style="display:flex;gap:.5rem"><input id="sPath" placeholder="z. B. vehicles"><button id="bFind">Suchen</button></div>
  <div id="found" class="mut" style="margin-top:.4rem"></div>
  <label>Feld für Kurs</label><select id="sKurs"></select>
  <label>Feld für Dienst</label><select id="sDienst"></select>
  <label>Radius „im Betriebshof" um bekannte Strang-Punkte (Meter)</label><input id="sRad" type="number" min="20" max="2000">
  <label>Länge einer Reihe ab Messpunkt (Meter, Wagen weiter weg gelten nicht als in dieser Reihe)</label><input id="sLen" type="number" min="10" max="300">
  <label>In welche Richtung verlaufen die Reihen ab den Messpunkten?</label>
  <select id="sSide"><option value="SW">Südwest (von der Straße in die Halle, Standard)</option><option value="NE">Nordost</option></select>
  <label>Radius um Einzelpunkte wie „ABC" oder „Waschstraße" (Meter)</label><input id="sPt" type="number" min="3" max="100">
  <label>Toleranz quer zur Reihe (Meter, GPS ungenau → größer = mehr Strang-Bereiche)</label><input id="sTol" type="number" min="0.5" max="10" step="0.5">
  <label>Strang-Punkte, eine pro Zeile: {"strang":"18","lat":51.18,"lon":6.45}. Optional <b>"achse":"NS"</b> = Reihe ist entlang des Breitengrads (51.xxxx) frei verschiebbar, <b>"achse":"EW"</b> = entlang des Längengrads (6.xxxx), <b>"winkel":35</b> = beliebige Richtung der Reihe in Grad (0 = Nord, 90 = Ost, im Uhrzeigersinn; z. B. schräg wie der Carport). Ohne Angabe: Reihe senkrecht zur Punktlinie.</label>
  <textarea id="sAnch" rows="16" spellcheck="false"></textarea>
  <div class="row">
    <button id="bClear">Gemerkte Wagen löschen</button>
    <button id="bCancel">Abbrechen</button>
    <button id="bSave" class="on">Speichern &amp; verbinden</button>
  </div>
</dialog>

<dialog id="dDet">
  <h3 style="margin-top:0" id="dTitle"></h3>
  <pre id="dJson"></pre>
  <div class="row"><button id="bDetClose" class="on">Schließen</button></div>
</dialog>

<script>
(()=>{
const LS='betriebshofliste.v1';
const DEF={dbUrl:'https://fahrgastzahlen-default-rtdb.europe-west1.firebasedatabase.app',path:'',kursKey:'',dienstKey:'',rad:250,len:50,side:'SW',pt:15,every:120,stopKey:'',map:'google',mapTpl:'',tol:2,anchors:[],marks:[],anchorsInit:0,known:{}};
const DEFAULT_ANCHORS=[[18,51.183880,6.450556],[19,51.183902,6.450533],[20,51.183935,6.450496],[21,51.183963,6.450465],[22,51.184001,6.450433],[23,51.184022,6.450415],[24,51.184056,6.450378],[25,51.184086,6.450358],[26,51.184125,6.450318],[27,51.184150,6.450304],[28,51.184184,6.450260],[29,51.184219,6.450236],[30,51.184277,6.450187],[31,51.184304,6.450151],[32,51.184342,6.450111],[33,51.184372,6.450091],[34,51.184401,6.450057],[35,51.184113,6.449165],[36,51.184138,6.449150],['ABC',51.184093,6.451131],['Waschstraße',51.184607,6.4498481]].map(a=>({strand:String(a[0]),lat:a[1],lon:a[2]}));
let S=load();
if(S.anchorsInit!==2){S.anchors=DEFAULT_ANCHORS.map(a=>({...a}));S.anchorsInit=2;}
if(!Array.isArray(S.marks))S.marks=[];
if(S.lenV!==2){S.len=50;S.lenV=2}   // Reihenlänge 50 m (ersetzt früheren Standard 80)
function load(){try{return Object.assign({},DEF,JSON.parse(localStorage.getItem(LS)||'{}'))}catch(e){return {...DEF}}}
let saveT=0;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}},500)}

const $=id=>document.getElementById(id);
let tree={}, es=null, filter='alle', sortKey='wagen', sortDir=1, rawById={};

/* ---------- Firebase Streaming (REST, Server-Sent Events) ---------- */
function setConn(on,txt){$('conn').className='conn'+(on?' on':'');$('connTxt').textContent=txt}
function notice(html,err){$('notice').innerHTML=html?`<div class="msg${err?' err':''}">${html}</div>`:''}
function connect(){
  if(es){es.close();es=null}
  tree={};lastIngest=0;
  if(!S.dbUrl){notice('Bitte in den Einstellungen die Datenbank-URL eintragen.');return}
  if(!S.path){notice('Der Pfad der Fahrzeuge ist noch nicht gesetzt. Öffne die <b>Einstellungen</b> und klicke bei „Pfad" auf <b>Suchen</b>. Wird der Zugriff nicht angenommen, versuche <i>livegeomatching/busses/<i/>');setConn(false,'kein Pfad');return}
  const url=S.dbUrl.replace(/\/$/,'')+'/'+S.path.replace(/^\/|\/$/g,'')+'.json';
  setConn(false,'verbinde …');
  es=new EventSource(url);
  es.addEventListener('open',()=>{setConn(true,'live verbunden');notice('')});
  es.addEventListener('error',()=>{setConn(false,'Verbindung gestört – versuche erneut');});
  es.addEventListener('put',e=>{apply(JSON.parse(e.data),false)});
  es.addEventListener('patch',e=>{apply(JSON.parse(e.data),true)});
  es.addEventListener('cancel',()=>{setConn(false,'Zugriff verweigert');notice('Die Datenbank verweigert das Lesen unter diesem Pfad (Permission denied). Pfad prüfen oder Anmeldung nötig.',true)});
  es.addEventListener('auth_revoked',()=>{setConn(false,'Anmeldung abgelaufen')});
}
function setIn(path,val){
  const p=path.split('/').filter(Boolean);
  if(!p.length){tree=val&&typeof val==='object'?val:{};return}
  let o=tree;
  for(let i=0;i<p.length-1;i++){if(!o[p[i]]||typeof o[p[i]]!=='object')o[p[i]]={};o=o[p[i]]}
  if(val===null)delete o[p[p.length-1]];else o[p[p.length-1]]=val;
}
function apply(m,patch){
  if(patch){for(const k in m.data)setIn((m.path.replace(/\/$/,''))+'/'+k,m.data[k])}
  else setIn(m.path,m.data);
  if(now()-lastIngest>=S.every*1000)ingest();   // sonst erst beim nächsten Takt
}
let lastIngest=0;

/* ---------- Fahrzeuge ableiten ---------- */
const now=()=>Date.now();
function dist(a,b,c,d){const R=6371000,t=x=>x*Math.PI/180,dl=t(c-a),dn=t(d-b);const h=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function dig(o,path){return path.split('.').reduce((x,k)=>x==null?undefined:x[k],o)}
function ingest(){
  const t=now(), ids=new Set();
  lastIngest=t;
  rawById={};
  for(const id of Object.keys(tree)){
    const v=tree[id]; if(!v||typeof v!=='object')continue;
    const g=v.geomatching||{}, r=v.raw||{};
    const wagen=String(r.vehicle??g.vehicle??id);
    ids.add(wagen); rawById[wagen]=v;
    const lat=Number(r.lat??g.lat), lon=Number(r.lon??g.lon);
    const ts=Date.parse(r.send_time||r.time)||t;
    const visible=!!(g.IS_GEORTET&&g.IS_ONLINE&&!r.exclusion_zone&&isFinite(lat)&&isFinite(lon));
    const k=S.known[wagen]||(S.known[wagen]={wagen});
    Object.assign(k,{
      line:g.LI_NR!=null?String(g.LI_NR):(k.line||''),
      dest:g.LIDNAME??k.dest??'',
      next:g.NEXT_ORT_REF_ORT_NAME??'',
      kurs:pickKurs(v,g,r),
      dienst:S.dienstKey?fmt(dig(v,S.dienstKey)):'',
      excl:!!r.exclusion_zone, visible, inDb:true, seen:t,
      ts
    });
    if(isFinite(lat)&&isFinite(lon)&&lat&&lon){k.lat=lat;k.lon=lon}
    if(k.next&&k.next!==0&&k.next!=='0'){          // Halt gewechselt → der alte ist der zuletzt passierte
      if(k.curNext&&k.next!==k.curNext&&visible)k.lastStop=k.curNext;
      k.curNext=k.next;
    }
    if(S.stopKey){const sv=fmt(dig(v,S.stopKey));if(sv)k.stopField=sv}
    const sd=parseTerminus(r.terminus??g.terminus);if(sd)k.side=sd;
    const sn=r.stationname??g.stationname;                 // Mönchengladbach: Station aus der GPS-Ortung
    if(sn&&String(sn).trim())k.station=String(sn).trim();
    const sid=r.stationid??g.stationid;                      // Haltestellennummer, 1:1 aus den Rohdaten
    if(sid!=null&&String(sid).trim()&&Number(sid)!==0)k.stationId=String(sid).trim();
    settle(k,t);
  }
  for(const w in S.known){
    const k=S.known[w];
    if(!ids.has(w)){k.inDb=false; k.visible=false}
    if(t-(k.seen||0)>36*3600e3){delete S.known[w];continue}
    trackHof(k,t);
  }
  save(); render(); showStand();
}
function showStand(){
  $('stand').textContent=lastIngest?'Stand '+new Date(lastIngest).toLocaleTimeString('de-DE')+' · alle '+S.every+' s':'';
}
/* Hofposition: beim Ankommen festhalten, solange der Wagen im Hof ist behalten, beim Ausfahren verwerfen */
function trackHof(k,t){
  if(k.visible){
    if(k.inHof){k.inHof=false;k.hofLat=k.hofLon=k.hofT=k.hofSince=undefined}
    return;
  }
  const st=derive(k).status;
  if(st==='hof'){
    if(!k.inHof){k.inHof=true;k.hofSince=t}
    if(k.inDb&&k.lat!=null){k.hofLat=k.lat;k.hofLon=k.lon;k.hofT=k.ts}   // letzte gemeldete Position im Hof
    if(k.hofLat==null&&k.lat!=null){k.hofLat=k.lat;k.hofLon=k.lon;k.hofT=k.ts}
  }
}
/* Kurs: gewähltes Feld; ist es leer oder nur die Linie (z. B. LI_KU_NR), dann die Fahrtnummer (trip) */
function pickKurs(v,g,r){
  let kv=S.kursKey?fmt(dig(v,S.kursKey)):'';
  const ln=g.LI_NR!=null?String(g.LI_NR):'';
  if(!kv||kv===ln)kv=fmt(r.trip??g.trip);
  return kv;
}
/* terminus: führende Ziffer, dann 32 Zeichen Frontanzeige (= Hauptziel, steht schon in „Ziel"), danach die Seitenanzeige in 16-Zeichen-Zeilen */
function parseTerminus(t){
  if(t==null)return '';
  const x=String(t).replace(/^\d/,'').slice(32);
  const lines=[];for(let i=0;i<x.length;i+=16)lines.push(x.slice(i,i+16).trim());
  return lines.filter(Boolean).join(' ');
}
function fmt(x){return x==null?'':typeof x==='object'?JSON.stringify(x):String(x)}
/* Linie entprellen: Wechsel erst nach 15 s Stabilität */
function settle(k,t){
  if(k.lineStable===undefined){k.lineStable=k.line;k.cand=k.line;k.since=t;return}
  if(k.line===k.lineStable){k.cand=k.line;return}
  if(k.cand!==k.line){k.cand=k.line;k.since=t}
  else if(t-k.since>=15000)k.lineStable=k.line;
}
function posOf(k){return (k.inHof&&k.hofLat!=null)?{lat:k.hofLat,lon:k.hofLon}:(k.lat!=null?{lat:k.lat,lon:k.lon}:null)}
/* ---------- Strang-Zuordnung: jeder Strang = Reihe, Messpunkt = Reihenanfang ---------- */
let geo=null;
function buildGeo(){
  const all=S.anchors.filter(a=>isFinite(a.lat)&&isFinite(a.lon));
  const valid=all.filter(a=>!a.achse);
  const isNum=a=>/^\d+(\.\d+)?$/.test(String(a.strand).trim());
  const pts=[...valid.filter(isNum).sort((x,y)=>parseFloat(x.strand)-parseFloat(y.strand)),...valid.filter(a=>!isNum(a))];
  if(!all.length){geo={cl:[],ax:[],lat0:0,lon0:0,kx:111320,ky:111320};return}
  const lat0=all.reduce((s,a)=>s+a.lat,0)/all.length, lon0=all.reduce((s,a)=>s+a.lon,0)/all.length;
  const kx=111320*Math.cos(lat0*Math.PI/180), ky=111320;
  const xy=a=>({x:(a.lon-lon0)*kx,y:(a.lat-lat0)*ky});
  const cl=[];let cur=null,prev=null;
  for(const a of pts){
    const q={...a,...xy(a)};
    if(!cur||Math.hypot(q.x-prev.x,q.y-prev.y)>15){cur={pts:[]};cl.push(cur)}
    cur.pts.push(q);prev=q;
  }
  for(const c of cl){
    const f=c.pts[0],l=c.pts[c.pts.length-1];
    const dx=l.x-f.x,dy=l.y-f.y,n=Math.hypot(dx,dy);
    if(c.pts.length>=2&&n>0){c.a={x:dx/n,y:dy/n};c.pts.forEach(q=>q.u=(q.x-f.x)*c.a.x+(q.y-f.y)*c.a.y)}
  }
  geo={cl,ax:all.filter(a=>a.achse).map(a=>({...a,...xy(a)})),lat0,lon0,kx,ky};
}
function toXY(p){return {x:(p.lon-geo.lon0)*geo.kx,y:(p.lat-geo.lat0)*geo.ky}}
function locate(p){const r=locate0(p);if(r)r.label=r.label.replace(/^Strang (?=\D)/,'');return r}
function locate0(p){
  if(!p)return null;
  if(!geo)buildGeo();
  if(!geo.cl.length&&!geo.ax.length&&!S.marks.length)return null;
  for(const m of S.marks){if(dist(p.lat,p.lon,m.lat,m.lon)<=8)return {strand:m.strand,label:'Strang '+m.strand,v:0,cl:-1}}
  const q=toXY(p);let best=null;
  geo.cl.forEach((c,ci)=>{
    if(!c.a){                                                // Einzelpunkt (z. B. ABC, Waschstraße): Radius
      for(const t of c.pts){const d=Math.hypot(q.x-t.x,q.y-t.y);
        if(d<=S.pt&&(!best||d<Math.abs(best.v)))best={e:d,strand:t.strand,v:d,cl:-2,label:'Strang '+t.strand};}
      return;
    }
    const f=c.pts[0],dx=q.x-f.x,dy=q.y-f.y;
    const u=dx*c.a.x+dy*c.a.y, v=c.a.x*dy-c.a.y*dx;
    const lf={x:-c.a.y,y:c.a.x}, w=S.side==='NE'?{x:.7071,y:.7071}:{x:-.7071,y:-.7071};
    const vr=v*((lf.x*w.x+lf.y*w.y)>=0?1:-1);               // >0 = in Richtung der Reihen
    if(vr<-3||vr>S.len)return;                               // nur eine Seite, 3 m GPS-Spielraum
    const near=c.pts.reduce((m,t)=>Math.abs(u-t.u)<Math.abs(u-m.u)?t:m);
    const lastU=c.pts[c.pts.length-1].u, edge=Math.max(S.tol,3);
    if(u<-edge||u>lastU+edge)return;                       // seitlich neben der Gruppe
    const cands=c.pts.filter(t=>t===near||Math.abs(u-t.u)<=S.tol);
    const e=Math.abs(u-near.u);
    if(!best||Math.abs(vr)<Math.abs(best.v)-1e-9||(Math.abs(Math.abs(vr)-Math.abs(best.v))<1e-9&&e<best.e)){
      const nums=cands.map(t=>parseFloat(t.strand)),allNum=nums.every(isFinite);
      const lo=Math.min(...nums),hi=Math.max(...nums);
      best={e,strand:near.strand,v:vr,cl:ci,label:cands.length>1?(allNum?`Strang ${lo}–${hi}`:'Strang '+cands.map(t=>t.strand).join('/'))+` (wahrsch. ${near.strand})`:'Strang '+near.strand};
    }
  });
  /* Punkte mit "achse": Reihe läuft entlang einer Achse und ist dort frei verschiebbar (beidseitig, bis Reihenlänge).
     NS = Breitengrad (51.xxxx) wandert, Längengrad bleibt; EW = Längengrad (6.xxxx) wandert, Breitengrad bleibt */
  const ex=Math.max(S.tol,3),ac=[];
  for(const t of geo.ax){
    const dx=q.x-t.x,dy=q.y-t.y,br=(t.achse==='NS'?0:t.achse==='EW'?90:Number(t.achse))*Math.PI/180,ux=Math.sin(br),uy=Math.cos(br),
      along=Math.abs(dx*ux+dy*uy),across=Math.abs(dx*uy-dy*ux);
    if(across<=ex&&along<=S.len)ac.push({t,across,along});
  }
  if(ac.length){
    ac.sort((a,b)=>a.across-b.across||a.along-b.along);
    const n=ac[0],cands=ac.filter(x=>x===n||x.across<=S.tol).map(x=>x.t.strand);
    const nums=cands.map(parseFloat),allNum=nums.every(isFinite);
    const label=cands.length>1?(allNum?`Strang ${Math.min(...nums)}–${Math.max(...nums)}`:'Strang '+cands.join('/'))+` (wahrsch. ${n.t.strand})`:'Strang '+n.t.strand;
    if(!best||n.across<best.e)best={e:n.across,strand:n.t.strand,v:n.along,cl:100,label};
  }
  return best;
}
function minAnchorDist(p){
  if(!p)return Infinity;
  let m=Infinity;for(const a of S.anchors){m=Math.min(m,dist(p.lat,p.lon,a.lat,a.lon))}return m;
}
function derive(k){
  const p=posOf(k);
  const loc=p?locate(p):null;
  const nearHof=p&&(loc||minAnchorDist(p)<=S.rad);
  let status,ort='';
  if(k.visible){status='fahrt';ort=''}
  else if(k.inHof||k.excl||nearHof){
    status='hof';
    ort=loc?loc.label:'Hof · Strang unbekannt';
    if(!p)ort='Hof · keine Position';
  } else {status='off';ort=''}
  return {status,ort,loc,coord:p?fmtC(p):''};
}

/* ---------- Anzeige ---------- */
function stopText(k){
  const last=(S.stopKey&&k.stopField)?k.stopField:(k.station||k.lastStop||'');
  const nxt=k.curNext&&k.curNext!==last?String(k.curNext):'';
  if(last&&nxt)return last+' → '+nxt;
  return last||(nxt?'→ '+nxt:'');
}
function stopHtml(k){return esc(stopText(k))+(k.stationId?' <span class="mut sid" title="Haltestellennummer (stationid)">'+esc(k.stationId)+'</span>':'')}
function fmtC(p){return p.lat.toFixed(5)+', '+p.lon.toFixed(5)}
function mapUrl(p){
  const la=p.lat.toFixed(6),lo=p.lon.toFixed(6);
  if(S.map==='osm')return `https://www.openstreetmap.org/?mlat=${la}&mlon=${lo}#map=19/${la}/${lo}`;
  if(S.map==='custom'&&S.mapTpl)return S.mapTpl.replace(/\{lat\}/g,la).replace(/\{lon\}/g,lo);
  return `https://www.google.com/maps/search/?api=1&query=${la},${lo}`;
}
const ST={fahrt:'Unterwegs',hof:'Im Betriebshof',off:'Kein Signal'};
function ago(ts){if(!ts)return'';const s=Math.max(0,Math.round((now()-ts)/1000));if(s<60)return s+' s';if(s<3600)return Math.round(s/60)+' min';return Math.round(s/3600)+' h'}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function buildRows(){
  const rows=Object.values(S.known).map(k=>({k,...derive(k)}));
  const grp={};
  rows.forEach(r=>{
    r.strangLabel=r.status==='hof'&&r.loc?r.loc.label:null;
    r.strang=r.status==='hof'&&r.loc?r.loc.strand:null;
    r.platz=null;
    if(r.status==='hof'&&r.loc&&r.loc.cl>=0){(grp[r.loc.cl+'/'+r.loc.strand]=grp[r.loc.cl+'/'+r.loc.strand]||[]).push(r)}
  });
  Object.values(grp).forEach(g=>{g.sort((x,y)=>Math.abs(x.loc.v)-Math.abs(y.loc.v));g.forEach((r,i)=>{r.platz=i+1;r.ort+=` · ${i+1}. Wagen`;})});
  rows.forEach(r=>{if(r.status==='hof'&&r.k.hofSince)r.ort+=' · seit '+new Date(r.k.hofSince).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})});
  return rows;
}
function render(){
  const q=$('q').value.trim().toLowerCase();
  let rows=buildRows();
  rows=rows.filter(r=>(filter==='alle'||r.status===filter)&&(!q||[r.k.wagen,r.k.lineStable,r.k.kurs,r.k.dienst,r.ort,r.coord,r.k.dest,r.k.side,stopText(r.k),r.k.stationId].join(' ').toLowerCase().includes(q)));
  const val=r=>sortKey==='wagen'?+r.k.wagen:sortKey==='line'?r.k.lineStable:sortKey==='status'?r.status:sortKey==='ort'?(r.ort||r.coord):sortKey==='dest'?r.k.dest:sortKey==='stop'?stopText(r.k):sortKey==='t'?-r.k.ts:r.k[sortKey]||'';
  rows.sort((a,b)=>{const x=val(a),y=val(b);return (x>y?1:x<y?-1:0)*sortDir});
  $('tb').innerHTML=rows.map(r=>`<tr data-w="${esc(r.k.wagen)}" title="Doppelklick: Rohdaten">
    <td class="n">${esc(r.k.wagen)}</td><td class="n">${esc(r.k.lineStable)}</td><td>${esc(r.k.kurs)}</td><td>${esc(r.k.dienst)}</td>
    <td><span class="tag ${r.status}">${ST[r.status]}</span></td><td class="wrap">${r.status==='hof'?esc(r.ort)+(r.coord?'<br><span class="mut">'+esc(r.coord)+'</span>':''):esc(r.coord)}</td><td class="stop">${stopHtml(r.k)}</td><td class="wrap mut">${esc(r.k.dest)}${r.k.side?'<br><span class="side">'+esc(r.k.side)+'</span>':''}</td>
    <td class="mut">${ago(r.k.ts)}</td>
    <td>${posOf(r.k)?`<a href="${mapUrl(posOf(r.k))}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Karte</a>`:''}</td></tr>`).join('');
  const total=Object.keys(S.known).length;
  $('cnt').textContent=total?`${rows.length} von ${total} Wagen`:'';
  if(!total&&es&&$('conn').classList.contains('on'))notice('Verbunden, aber unter diesem Pfad liegen keine Fahrzeuge. Pfad in den Einstellungen prüfen.');
}
$('tb').addEventListener('dblclick',e=>{
  const tr=e.target.closest('tr[data-w]');
  if(!tr||e.target.closest('a'))return;
  const w=tr.dataset.w;
  $('dTitle').textContent='Wagen '+w+' – Rohdaten';
  $('dJson').textContent=JSON.stringify(rawById[w]??{hinweis:'Wagen ist aktuell nicht in der Datenbank. Letzter bekannter Stand:',...S.known[w]},null,2);
  $('dDet').showModal();
});
document.querySelectorAll('.bar button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('.bar button').forEach(x=>x.classList.toggle('on',x===b));render()});
document.querySelectorAll('th[data-s]').forEach(th=>th.onclick=()=>{const s=th.dataset.s;if(sortKey===s)sortDir*=-1;else{sortKey=s;sortDir=1}render()});
$('q').oninput=render;
$('bDetClose').onclick=()=>$('dDet').close();
addEventListener('pagehide',()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}});
setInterval(()=>{if(es&&now()-lastIngest>=S.every*1000)ingest()},2000);
$('bNow').onclick=()=>ingest();

/* ---------- Hof-/Strang-Daten als JSON ---------- */
const iso=t=>t?new Date(t).toISOString():null;
function buildJson(){
  return {
    format:'betriebshofliste-straenge/1', betriebshof:'Rheinstraße',
    einstellungen:{richtung:S.side,reihenlaengeM:S.len,toleranzQuerM:S.tol,radiusEinzelpunktM:S.pt,radiusHofM:S.rad},
    straenge:S.anchors.map(a=>({strang:a.strand,lat:a.lat,lon:a.lon,...(a.achse?{achse:a.achse}:{})}))
  };
}
const jsonText=(withTime)=>JSON.stringify({...buildJson(),gespeichert:withTime?new Date().toISOString():undefined},null,2);

/* Datei dauerhaft verbinden (Chrome/Edge: File System Access) – Handle bleibt im Browser gemerkt */
const idb=()=>new Promise((res,rej)=>{const q=indexedDB.open('bhl',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
async function kvGet(k){try{const d=await idb();return await new Promise(r=>{const t=d.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>r(t.result);t.onerror=()=>r(null)})}catch(e){return null}}
async function kvSet(k,v){try{const d=await idb();await new Promise(r=>{const t=d.transaction('kv','readwrite').objectStore('kv').put(v,k);t.onsuccess=t.onerror=()=>r()})}catch(e){}}
let fh=null,lastBody='';
function showFh(msg){$('fhStat').textContent=msg||(fh?'Datei: '+fh.name:'')}
async function fhOk(ask){if(!fh)return false;try{let p=await fh.queryPermission({mode:'readwrite'});if(p!=='granted'&&ask)p=await fh.requestPermission({mode:'readwrite'});return p==='granted'}catch(e){return false}}
async function writeFile(){
  const w=await fh.createWritable();await w.write(jsonText(true));await w.close();
  lastBody=JSON.stringify(buildJson());showFh('gespeichert '+new Date().toLocaleTimeString('de-DE')+' · '+fh.name);
}
async function autoSave(){
  if(!fh)return;
  if(!(await fhOk(false))){showFh('Datei nicht freigegeben – „Stränge speichern“ klicken');return}
  if(JSON.stringify(buildJson())===lastBody)return;       // nur schreiben, wenn sich etwas geändert hat
  try{await writeFile()}catch(e){showFh('Speichern fehlgeschlagen')}
}
function downloadJson(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([jsonText(true)],{type:'application/json'}));
  a.download='straenge.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
$('bJson').onclick=async e=>{
  if(!window.showSaveFilePicker){downloadJson();return}
  try{
    if(e.shiftKey||!fh||!(await fhOk(true))){
      fh=await window.showSaveFilePicker({suggestedName:'straenge.json',types:[{description:'JSON',accept:{'application/json':['.json']}}]});
      await kvSet('fh',fh);
    }
    await writeFile();
  }catch(err){if(err.name!=='AbortError'){downloadJson()}}
};
$('bLoad').onclick=()=>$('fLoad').click();
$('fLoad').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const j=JSON.parse(await f.text());
    const list=(Array.isArray(j.straenge)?j.straenge:Array.isArray(j.strangPunkte)?j.strangPunkte:null);
    if(!list)throw new Error('keine Strang-Datei');
    const pts=[];
    for(const x of list){const st=x.strang??x.strand,lat=Number(x.lat),lon=Number(x.lon);if(st!=null&&isFinite(lat)&&isFinite(lon)){const pt={strand:String(st),lat,lon},ax=axisOf(x);if(ax!=null)pt.achse=ax;pts.push(pt)}}
    if(!pts.length)throw new Error('keine Stränge gefunden');
    S.anchors=pts;S.anchorsInit=2;
    const o=j.einstellungen||{};
    if(o.richtung==='SW'||o.richtung==='NE')S.side=o.richtung;
    if(+o.reihenlaengeM>0)S.len=+o.reihenlaengeM;
    if(+o.toleranzQuerM>0)S.tol=+o.toleranzQuerM;
    if(+o.radiusEinzelpunktM>0)S.pt=+o.radiusEinzelpunktM;
    if(+o.radiusHofM>0)S.rad=+o.radiusHofM;
    geo=null;save();render();alert(pts.length+' Stränge geladen.');
  }catch(err){alert('Datei konnte nicht gelesen werden: '+err.message)}
};
(async()=>{try{if(window.showSaveFilePicker){fh=await kvGet('fh');showFh(fh?'Datei: '+fh.name+' (zum Aktivieren „Stränge speichern“ klicken)':'')}}catch(e){}})();

/* ---------- Einstellungen ---------- */
function fieldOptions(sel,cur){
  const keys=new Set();
  const walk=(o,p,d)=>{if(d>2||!o||typeof o!=='object')return;for(const k in o){const kp=p?p+'.'+k:k;if(o[k]&&typeof o[k]==='object')walk(o[k],kp,d+1);else keys.add(kp)}};
  Object.values(tree).slice(0,30).forEach(v=>walk(v,'',0));
  sel.innerHTML='<option value="">– nicht zugeordnet –</option>'+[...keys].sort().map(k=>`<option ${k===cur?'selected':''}>${esc(k)}</option>`).join('');
  if(cur&&!keys.has(cur))sel.insertAdjacentHTML('beforeend',`<option selected>${esc(cur)}</option>`);
}
$('bSet').onclick=()=>{
  $('sUrl').value=S.dbUrl;$('sPath').value=S.path;$('sRad').value=S.rad;
  $('sLen').value=S.len;$('sSide').value=S.side||'SW';$('sPt').value=S.pt||15;$('sEvery').value=S.every||120;$('sTol').value=S.tol;$('sAnch').value=S.anchors.map(a=>JSON.stringify({strang:a.strand,lat:a.lat,lon:a.lon,...(a.achse?{achse:a.achse}:{})})).join(',\n');
  fieldOptions($('sKurs'),S.kursKey);fieldOptions($('sDienst'),S.dienstKey);fieldOptions($('sStop'),S.stopKey);$('sMap').value=S.map||'google';$('sMapTpl').value=S.mapTpl||'';
  $('found').textContent='';$('dSet').showModal();
};
$('bCancel').onclick=()=>$('dSet').close();
$('bClear').onclick=()=>{if(confirm('Alle gemerkten Wagen löschen?')){S.known={};save();render()}};
$('bSave').onclick=()=>{
  S.dbUrl=$('sUrl').value.trim();S.path=$('sPath').value.trim();
  S.kursKey=$('sKurs').value;S.dienstKey=$('sDienst').value;S.stopKey=$('sStop').value;S.map=$('sMap').value;S.mapTpl=$('sMapTpl').value.trim();S.rad=+$('sRad').value||250;
  S.len=+$('sLen').value||50;S.side=$('sSide').value;S.pt=+$('sPt').value||15;S.every=Math.max(5,+$('sEvery').value||120);S.tol=+$('sTol').value||2;
  const parsed=parseAnchors($('sAnch').value);
  if(parsed)S.anchors=parsed;else alert('Strang-Punkte: nichts Lesbares gefunden – bisherige Punkte bleiben.');
  geo=null;save();render();autoSave();$('dSet').close();connect();
};
/* tolerant: akzeptiert strang/strand, Komma am Ende, Leerzeichen, überzählige Klammern */
function axisOf(o){const r=axisRaw(o);return r===0?'NS':r===90?'EW':r}
function axisRaw(o){
  const w=o.winkel??o.bearing, a=String(o.achse??o.axis??'').toUpperCase();
  if(w!=null&&isFinite(Number(String(w).replace(',','.'))))return ((Number(String(w).replace(',','.'))%180)+180)%180;
  if(a==='NS'||a==='EW')return a;
  const n=Number(a.replace(',','.'));return a!==''&&isFinite(n)?((n%180)+180)%180:null;
}
function parseAnchors(txt){
  const out=[];
  for(const m of String(txt).match(/\{[^{}]*\}/g)||[]){
    try{
      const o=JSON.parse(m);
      const st=o.strand??o.strang??o.strasse??o.name;
      const lat=Number(String(o.lat).replace(',','.')),lon=Number(String(o.lon??o.lng).replace(',','.'));
      if(st!=null&&isFinite(lat)&&isFinite(lon)){const pt={strand:String(st),lat,lon},ax=axisOf(o);if(ax!=null)pt.achse=ax;out.push(pt)}
    }catch(e){}
  }
  return out.length?out:null;
}
$('bFind').onclick=async()=>{
  const f=$('found');f.textContent='suche …';
  try{
    const r=await fetch($('sUrl').value.trim().replace(/\/$/,'')+'/.json?shallow=true');
    const j=await r.json();
    if(!r.ok||(j&&j.error)){f.textContent='Antwort: '+(j&&j.error||r.status)+' – Das Lesen der Wurzel ist nicht erlaubt. Den Pfad musst du dann manuell eintragen (aus den WS-Nachrichten, Feld "p").';return}
    const keys=Object.keys(j||{});
    f.innerHTML=keys.length?'Gefunden: '+keys.map(k=>`<button type="button" data-p="${esc(k)}">${esc(k)}</button>`).join(' '):'Datenbank ist leer.';
    f.querySelectorAll('button').forEach(b=>b.onclick=()=>{$('sPath').value=b.dataset.p});
  }catch(e){f.textContent='Nicht erreichbar: '+e.message}
};

connect();render();
})();
