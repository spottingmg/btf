name: Wagen sammeln

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wagen-sammeln
  cancel-in-progress: false

jobs:
  sammeln:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bisherigen Verlauf laden
        run: |
          mkdir -p data
          if git fetch --depth=1 origin data 2>/dev/null; then
            git show FETCH_HEAD:fahrzeuge.json > data/fahrzeuge.json || rm -f data/fahrzeuge.json
          fi
      - name: Sammeln
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node snapshot.mjs
